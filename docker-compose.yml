version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nidhisetu-app
    ports:
      - "8000:8000"
    environment:
      - NIDHISETU_ENVIRONMENT=demo
      - NIDHISETU_DATABASE_URL=postgresql+psycopg://nidhisetu:secret_db_pass@postgres:5432/nidhisetu_db
      - NIDHISETU_STORAGE_BACKEND=s3
      - NIDHISETU_S3_BUCKET_NAME=nidhisetu-vault
      - NIDHISETU_S3_ENDPOINT_URL=http://minio:9000
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - AWS_REGION=ap-south-1
      - NIDHISETU_JWT_SECRET=production-grade-jwt-secret-key-32-chars-long
      - NIDHISETU_FDR_HMAC_KEY=production-grade-hmac-secret-key-32-chars
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: nidhisetu-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: nidhisetu
      POSTGRES_PASSWORD: secret_db_pass
      POSTGRES_DB: nidhisetu_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nidhisetu -d nidhisetu_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: nidhisetu-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
